[project]
name = "stac-geoparquet-as-catalog-testbed"
version = "0.1.0"
description = "Testbed for describing a whole STAC catalog as one GeoParquet collection index"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "pyarrow>=26.0.0",
]
# geoparquet-io (gpio) pins duckdb<1.6, so it lives in its own environment: pipx install geoparquet-io

[tool.uv]
package = false
