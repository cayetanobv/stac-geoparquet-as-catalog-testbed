[project]
name = "stac-geoparquet-as-catalog-testbed"
version = "0.1.0"
description = "Testbed for describing a whole STAC catalog as one GeoParquet collection index"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "pyarrow>=26.0.0",
]
# The GeoParquet check is scripts/check_index.sql, run in DuckDB, so gpio is not needed

[tool.uv]
package = false
